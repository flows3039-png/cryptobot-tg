name: CryptoBot 24/7 Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run every 5 hours automatically
    - cron: '0 */5 * * *'

concurrency:
  group: cryptobot-server
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev libjpeg-dev zlib1g-dev
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git for persistence
        run: |
          git config user.name "CryptoBot Runner"
          git config user.email "bot-runner@users.noreply.github.com"

      - name: Run Bot (Continuous loop with state persistence)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8868899126:AAHzT4uBx6VWCWNnHDMXZz7HwXJyARIC0TM' }}
          OWNER_ID: ${{ secrets.OWNER_ID || '7162454634' }}
        run: |
          echo "Starting CryptoBot..."
          # Run python main.py for up to 300 minutes (5 hours)
          timeout 300m python main.py || true
          
          # Auto-commit and push database state
          echo "Saving database state..."
          git add cryptobot.db cryptobot.db-wal cryptobot.db-shm 2>/dev/null || true
          git commit -m "chore: persist cryptobot.db state [skip ci]" || true
          git push origin main || true

      - name: Trigger next cycle
        if: always()
        run: |
          echo "Triggering next run cycle..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}' || true
