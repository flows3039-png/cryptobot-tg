name: CryptoBot 24/7 Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run every 5 hours automatically
    - cron: '0 */5 * * *'

concurrency:
  group: cryptobot-server
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev libjpeg-dev zlib1g-dev
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (Continuous loop with state persistence)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          echo "Starting CryptoBot on GitHub Cloud Server..."
          timeout 300m python main.py || true

      - name: Trigger next cycle
        if: always()
        run: |
          echo "Triggering next run cycle..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}' || true
